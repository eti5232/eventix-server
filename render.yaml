# Render Blueprint: creates the database and the API (Docker) from this repository.
# The client lives in its own repository (eti5232/eventix-client) and is deployed as a separate static site.
# The API name was already taken on Render, so its real address has a suffix (eventix-api-ifp2).
# If an address ever changes, update VITE_API_URL (client) and Cors__AllowedOrigins__0 (API) to match.
databases:
  - name: eventix-db
    databaseName: eventix
    user: eventix
    plan: free
    region: frankfurt

services:
  - type: web
    name: eventix-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Eventix.API/Dockerfile
    dockerContext: .
    healthCheckPath: /api/categories
    envVars:
      - key: ConnectionStrings__Default
        fromDatabase:
          name: eventix-db
          property: connectionString
      # A random secret generated by Render (the code requires at least 32 bytes).
      - key: Jwt__Key
        generateValue: true
      # The address of the client below, so the browser is allowed to call this API.
      - key: Cors__AllowedOrigins__0
        value: https://eventix-client.onrender.com
