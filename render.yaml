# Render Blueprint: creates the database, the API (Docker) and the client (static site) from this repository.
# The API name was already taken on Render, so its real address has a suffix (eventix-api-ifp2).
# If an address ever changes, update VITE_API_URL (client) and Cors__AllowedOrigins__0 (API) to match.
databases:
  - name: eventix-db
    databaseName: eventix
    user: eventix
    plan: free
    region: frankfurt

services:
  - type: web
    name: eventix-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Eventix.API/Dockerfile
    dockerContext: .
    healthCheckPath: /api/categories
    envVars:
      - key: ConnectionStrings__Default
        fromDatabase:
          name: eventix-db
          property: connectionString
      # A random secret generated by Render (the code requires at least 32 bytes).
      - key: Jwt__Key
        generateValue: true
      # The address of the client below, so the browser is allowed to call this API.
      - key: Cors__AllowedOrigins__0
        value: https://eventix-client.onrender.com

  - type: web
    name: eventix-client
    runtime: static
    buildCommand: cd eventix-client && npm ci && npm run build
    staticPublishPath: ./eventix-client/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the client at build time: where the API lives.
      - key: VITE_API_URL
        value: https://eventix-api-ifp2.onrender.com
    routes:
      # Single-page app: every path serves index.html, so deep links and refresh work.
      - type: rewrite
        source: /*
        destination: /index.html
